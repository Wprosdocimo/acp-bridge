[project]
name = "acp-bridge"
dynamic = ["version"]
description = "Bridge service exposing local CLI agents via ACP over HTTP"
authors = [{name = "Xi Wan", email = "5155280@qq.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "acp-sdk>=1.0.3",
    "boto3>=1.42.93",
    "pyyaml>=6.0.3",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.uv]
# acp-sdk 1.0.3's Server.run annotates loop as uvicorn.config.LoopSetupType
# (renamed to LoopFactoryType in uvicorn 0.36). Upstream's own shim
# (src/acp_patch.py::_apply_uvicorn_loop_shim, added in v0.45.3) only works
# because PEP 649 defers annotation evaluation on Python 3.14 — on our
# pinned 3.12 (see .python-version; needed for an unrelated pydantic/3.14
# bug), `class Server: loop: uvicorn.config.LoopSetupType = "auto"` evaluates
# the annotation immediately at class-body time, which is also before
# acp_patch even runs (main.py imports acp_sdk.server at module load,
# acp_patch is only imported lazily inside a function much later). Confirmed
# by testing: removing this pin passes on paper but fails 2 test files at
# collection with AttributeError on uvicorn 0.52.4. Re-evaluate if this repo
# ever moves off Python 3.12, or if upstream restructures the import order.
override-dependencies = ["uvicorn<0.36"]

[dependency-groups]
dev = [
    "moto>=5.2.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
# The project had no explicit ruff config, so a newer ruff picked up its full
# default rule set and surfaced 450+ pre-existing findings at once. Pin an
# explicit, objective baseline (pyflakes + import sorting) and leave subjective
# / semantic-risk rules (blind-except, mutable defaults, one-line-statement
# style, etc.) out for now so they can be adopted incrementally without
# touching runtime behaviour.
line-length = 100
target-version = "py312"
# infra/ is a self-contained Lambda sub-project with its own lifecycle.
extend-exclude = ["infra"]

[tool.ruff.lint]
# F = pyflakes  (unused imports, undefined names, unused variables)
# I = isort     (import ordering)
select = ["F", "I"]
