[project]
name = "acp-bridge"
dynamic = ["version"]
description = "Bridge service exposing local CLI agents via ACP over HTTP"
authors = [{name = "Xi Wan", email = "5155280@qq.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "acp-sdk>=1.0.3",
    "boto3>=1.42.93",
    "pyyaml>=6.0.3",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.uv]
# acp-sdk 1.0.3 (only published version as of 2026-08) doesn't pin a compatible
# uvicorn range; uvicorn>=0.36 renamed config.LoopSetupType -> LoopFactoryType,
# breaking acp_sdk.server.server's import. Pin below the rename until acp-sdk
# fixes its own constraint upstream.
override-dependencies = ["uvicorn<0.36"]

[dependency-groups]
dev = [
    "moto>=5.2.3",
]
